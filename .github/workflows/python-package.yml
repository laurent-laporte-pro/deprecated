# Run the test suite and the quality checks with uv and Hatch.
# See: https://docs.astral.sh/uv/guides/integration/github/ and https://hatch.pypa.io/latest/

name: Python package

on:
  push:
    branches: ['master', 'main', 'develop']
  pull_request:
    branches: ['master', 'main', 'develop', 'release/**', 'hotfix/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"
  HATCH_VERSION: "1.18.1"

jobs:
  quality:
    name: Quality checks (hatch check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Check the lockfile is up to date
        run: uv lock --check

      - name: Install Hatch
        run: uv tool install "hatch==${HATCH_VERSION}"

      - name: Lint (hatch check code)
        run: hatch check code

      - name: Formatting (hatch check fmt)
        run: hatch check fmt

      - name: Typing (hatch check types)
        run: hatch check types

  pytest:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Test with pytest
        run: uv run --locked --python ${{ matrix.python-version }} pytest --cov --cov-report=term-missing

  wrapt-compat:
    name: Tests (wrapt compatibility matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Hatch
        run: uv tool install "hatch==${HATCH_VERSION}"

      - name: Test all Python / wrapt combinations (hatch test --all)
        run: hatch test --all
