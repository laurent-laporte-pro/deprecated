# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # The documentation dependencies are installed with uv, from the `docs` dependency group
  # of `pyproject.toml` (locked in `uv.lock`).
  # See https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv 0.12.19
      - asdf global uv 0.12.19
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --no-default-groups --group docs

sphinx:
  configuration: docs/source/conf.py
  # The warnings are checked by the CI (`make docs-check`): an unreachable intersphinx
  # inventory must not prevent the publication of the documentation.
  # fail_on_warning: true
